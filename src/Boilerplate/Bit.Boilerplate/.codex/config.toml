[mcp_servers.bitplatform]
url = "https://api.bitfabric.co/docs-mcp"

[mcp_servers.dev-mcp-test]
url = "https://use-your-test-api-server-url-here.com/dev-mcp"

[mcp_servers.dev-mcp-production]
url = "https://use-your-api-server-url-here.com/dev-mcp"

[mcp_servers.bit-fabric]
url = "https://api.bitfabric.co/mcp"

[mcp_servers.aspire]
command = "aspire"
args = ["agent", "mcp"]

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest", "--output-dir", ".playwright-mcp", "--output-max-size", "52428800"]
