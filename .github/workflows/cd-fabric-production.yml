name: cd-fabric-production

# Builds bit Fabric for Production when a founder pushes the tag fabric-v<Version>, <Version> being the one in
# src/Fabric/src/Directory.Build.props, on a commit of main: `git tag fabric-v0.0.25 && git push origin fabric-v0.0.25`.
# A merge into main publishes nothing. When the build ends, cd-fabric-dispatch.yml starts its deployment in
# bitfoundation/bitfabric-internal. By hand on an older tag it builds that version again, to roll back:
# `gh workflow run cd-fabric-production.yml --ref fabric-v0.0.24`. The Production environment lets no branch but main,
# which only cd-fabric-dispatch.yml runs on, and no tag but fabric-v*, use it.

on:
  push:
    tags: [ 'fabric-v*' ]
  workflow_dispatch:

# Queued, not cancelled: two tags in quick succession must not leave the older version deployed.
concurrency:
  group: cd-fabric-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  check_tag:
    name: check the tag
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse anything but fabric-v<Version> on a commit of main
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Fabric/src/Directory.Build.props | head -n 1)"
          if [ "$REF_TYPE" != tag ] || [ "$TAG" != "fabric-v$version" ]; then
            echo "::error::Production builds the tag fabric-v$version, the version in src/Fabric/src/Directory.Build.props, and this run is on the $REF_TYPE $TAG."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG isn't on main."
            exit 1
          fi
          echo "Building $TAG, commit $GITHUB_SHA of main, for Production." >> "$GITHUB_STEP_SUMMARY"

  build_production:
    name: build for production
    needs: check_tag
    permissions:
      contents: read
      id-token: write
      attestations: write
      # build_server pushes the server's images to GitHub Container Registry.
      packages: write
    uses: ./.github/workflows/cd-fabric.yml
    with:
      ENV_NAME: Production
      CODE_REF: ${{ github.sha }}
    secrets: inherit
