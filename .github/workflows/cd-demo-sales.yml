name: cd-demo-sales

# Makes the Sales module demo with bit new, from bit Boilerplate and bit CLI at the commit it runs on.
# cd-demos.yml runs it with the other demos. Only the builds run here, on GitHub's own runners; cd-fabric-dispatch.yml
# then starts bitfabric-internal's cd-demos, whose jobs on the demos' own server put each site this run built in place.
# The Demos environment, which holds the builds' keys, lets any branch of this repository use it; a pull request from a
# fork gets none of its secrets.

# Project templates come equipped with GitHub Actions CI/CD, providing you with a hassle-free way to get started with your new project. It is important to note that you should not depend on the contents of this file. More info at https://bitplatform.dev/templates/dev-ops

env:
  # Lets the About page show the run, the commit and the attestations of the build, only in a public repository whose links anyone can open.
  ShowBuildProvenance: ${{ github.event.repository.visibility == 'public' }}
  SERVER_ADDRESS: 'https://sales.bitfabric.co'
  # The summary.json of the demo's status page on bit Fabric, which the apps read to tell their users when something is wrong.
  STATUS_PAGE_SUMMARY_URL: 'https://api.bitfabric.co/api/v1/PublicStatus/Summary/bit-salesmodule'
  # The demo's project id, which every job gives its project once the DEMO_SALES_LICENSE secret holds the demo's License,
  # so that one License fits every run (See .github/actions/new-demo-project). Not a secret: without the License it gives nothing.
  DEMO_PROJECT_ID: '469f0afd-5043-484c-be01-877e08e602cd'
  R2_BUCKET: 'sales'
  OpenAI__ApiKey: ${{ secrets.OPENAI__APIKEY }}
  OpenAI__Endpoint: ${{ vars.OPENAI__ENDPOINT }}
  OPENAI__MODEL: ${{ vars.OPENAI__MODEL }}

on:
  workflow_dispatch:
    inputs:
      server:
        description: Server web
        type: boolean
        default: true
      windows:
        description: Windows app
        type: boolean
        default: true
      prerelease_packages:
        description: Bit packages of bitfoundation/bitplatform's latest CD Prerelease nuget packages run instead of nuget.org
        type: boolean
        default: false
  workflow_call:
    inputs:
      server:
        type: boolean
        default: true
      windows:
        type: boolean
        default: true
      prerelease_packages:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: cd-demo-sales
  cancel-in-progress: false

jobs:

  build_api_blazor:
    name: build api + blazor web
    if: inputs.server
    runs-on: windows-2025
    environment: Demos
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

    steps:
    
    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false
    
    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json
        dotnet-version: 10.0.x

    - name: Use prerelease packages
      if: inputs.prerelease_packages
      uses: ./.github/actions/use-prerelease-packages
      with:
        project-folder: src/Boilerplate/Bit.Boilerplate

    - name: Setup bit CLI
      uses: ./.github/actions/setup-bit-cli

    - name: Create project with bit new
      uses: ./.github/actions/new-demo-project
      with:
        project-id: ${{ env.DEMO_PROJECT_ID }}
        license: ${{ secrets.DEMO_SALES_LICENSE }}
        arguments: SalesModule --framework net10.0 --database PostgreSQL --module Sales --appInsights --apiServerUrl ${{ env.SERVER_ADDRESS }} --webAppUrl ${{ env.SERVER_ADDRESS }} --filesStorage S3 --notification --captcha reCaptcha --signalR --ads --template-package "$BIT_TEMPLATE_PACKAGE" --yes --no-build --no-format --no-migration --no-trust

    - name: Update core appsettings.json
      uses: devops-actions/variable-substitution@2344e258b5e8b1bd83b53f14271a410f7a4f5a44 # v3.1.0
      with:
        files: 'SalesModule/**/appsettings*json'
      env:
        StatusPageSummaryUrl: ${{ env.STATUS_PAGE_SUMMARY_URL }}
        WebAppRender.PrerenderEnabled: true
        ServerAddress: '/'
        WebAppRender.BlazorMode: 'BlazorWebAssembly'
        AdsPushVapid.PublicKey: ${{ secrets.SALES_PUBLIC_VAPIDKEY }}
        GoogleRecaptchaSiteKey: ${{ secrets.GOOGLE_RECAPTCHA_SITE_KEY }}
        ApplicationInsights.ConnectionString: ${{ secrets.APPLICATION_INSIGHTS_CONNECTION_STRING }}

    - name: Configure bswup
      run: |
          sed -i "s/\/\/ self.mode = 'AlwaysPrerender'/self.mode = 'AlwaysPrerender'/g" SalesModule/src/Client/SalesModule.Client.Web/wwwroot/service-worker.published.js

    - name: Configure text embedding
      run: |
          sed -i 's/IsEmbeddingEnabled = false/IsEmbeddingEnabled = true/' SalesModule/src/Server/SalesModule.Server.Api/Infrastructure/Data/AppDbContext.cs

    - name: Publish
      working-directory: SalesModule
      run: dotnet publish src/Server/SalesModule.Server.Web/SalesModule.Server.Web.csproj -c Release -o ../server -p:Version="${{ vars.APP_VERSION}}" -p:AspNetCoreHostingModel=OutOfProcess -p:BitMinifyAggressive=true -p:BitMinifyMapOutputPath="${{ github.workspace }}/bit-minifier.map"

    # Every publish renames afresh, so this map reads the stack traces of this release and of no other. It lives in
    # obj, which this checkout throws away - kept here, and never next to the client, which would serve it.
    - name: Upload minifier map artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: SalesModule-minifier-map
        path: bit-minifier.map

    # Server-owned; C:\inetpub keeps its own copies. Also keeps them out of the artifact.
    - name: Strip server-owned files from bundle
      shell: pwsh
      run: |
        Get-ChildItem server -File -Include 'appsettings*.json', 'AppCertificate.*', 'AppleAuthKey.p8', '*.pfx' -Recurse |
          ForEach-Object { Write-Host "Removing $($_.FullName)"; Remove-Item $_.FullName -Force }

    - name: Upload server artifact
      id: server_artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: SalesModule
        path: server
        include-hidden-files: true # Required for wwwroot/.well-known folder

    - name: Attest server artifact
      if: github.event.repository.visibility == 'public'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: SalesModule
        subject-digest: sha256:${{ steps.server_artifact.outputs.artifact-digest }}

  build_blazor_hybrid_windows:
    name: build blazor hybrid (windows)
    if: inputs.windows
    runs-on: windows-2025
    environment: Demos
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
  
    steps:
     
    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src\global.json
        dotnet-version: 10.0.x

    - name: Use prerelease packages
      if: inputs.prerelease_packages
      uses: ./.github/actions/use-prerelease-packages
      with:
        project-folder: src/Boilerplate/Bit.Boilerplate

    - name: Setup bit CLI
      uses: ./.github/actions/setup-bit-cli

    - name: Create project with bit new
      uses: ./.github/actions/new-demo-project
      with:
        project-id: ${{ env.DEMO_PROJECT_ID }}
        license: ${{ secrets.DEMO_SALES_LICENSE }}
        arguments: SalesModule --framework net10.0 --database PostgreSQL --module Sales --sentry --apiServerUrl ${{ env.SERVER_ADDRESS }} --webAppUrl ${{ env.SERVER_ADDRESS }} --filesStorage S3 --captcha reCaptcha --signalR --ads --template-package "$BIT_TEMPLATE_PACKAGE" --yes --platforms windows --no-build --no-format --no-migration --no-trust
  
    - name: Update core appsettings.json
      uses: devops-actions/variable-substitution@2344e258b5e8b1bd83b53f14271a410f7a4f5a44 # v3.1.0
      with:
        files: 'SalesModule\**\appsettings*json'
      env:
        StatusPageSummaryUrl: ${{ env.STATUS_PAGE_SUMMARY_URL }}
        Sentry.Dsn: ${{ secrets.SALES_SENTRY_DSN }}
        WebAppUrl: ${{ env.SERVER_ADDRESS }}
        ServerAddress: ${{ env.SERVER_ADDRESS }}
        GoogleRecaptchaSiteKey: ${{ secrets.GOOGLE_RECAPTCHA_SITE_KEY }}
        WindowsUpdate.FilesUrl: https://windows-sales.bitfabric.co

    - name: Translate .resx files
      run: |
            cd SalesModule
            bit translate

    - name: Install vpk
      shell: pwsh
      run: |
        dotnet tool install vpk --version 1.3.39-g8d2844f --tool-path "$env:RUNNER_TEMP/vpk"
        Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP/vpk"

    # Needed for delta packages. Fails on the first run, when the bucket is empty.
    - name: Download previous releases from R2
      continue-on-error: true
      run: |
          cd SalesModule\src\Client\SalesModule.Client.Windows\
          vpk download s3 --endpoint ${{ vars.R2_ENDPOINT }} --bucket ${{ env.R2_BUCKET }} --keyId ${{ secrets.R2_ACCESS_KEY_ID }} --secret ${{ secrets.R2_SECRET_ACCESS_KEY }} -o .\Releases

    # '\.dll$' signs only the executables: this CD runs often for end-to-end tests, and a demo's dlls gain nothing from a signature.
    - name: Sign the executables with Artifact Signing
      if: vars.CODE_SIGNING_ACCOUNT != ''
      uses: bitfoundation/bitplatform/.github/actions/bit-bp/artifact-signing@v-11.0.0-pre-23
      with:
        endpoint: ${{ vars.CODE_SIGNING_ENDPOINT }}
        account: ${{ vars.CODE_SIGNING_ACCOUNT }}
        certificate-profile: ${{ vars.CODE_SIGNING_CERTIFICATE_PROFILE }}
        client-id: ${{ secrets.CODE_SIGNING_CLIENT_ID }}
        tenant-id: ${{ secrets.CODE_SIGNING_TENANT_ID }}
        subscription-id: ${{ secrets.CODE_SIGNING_SUBSCRIPTION_ID }}
        exclude: '\.dll$'

    - name: Publish
      run: |
          cd SalesModule\src\Client\SalesModule.Client.Windows\
          dotnet publish SalesModule.Client.Windows.csproj -c Release -o .\publish-result -r win-x64 -p:Version="${{ vars.APP_VERSION}}" -p:PublishReadyToRun=true -p:PublishReadyToRunComposite=true --self-contained
          vpk pack -u SalesModule.Client.Windows -v "${{ vars.APP_VERSION }}" -p .\publish-result -e SalesModule.Client.Windows.exe -r win-x64 --framework webview2 --icon .\wwwroot\favicon.ico --packTitle 'SalesModule'

    - name: Attest the installer and packages
      if: github.event.repository.visibility == 'public'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: |
          SalesModule/src/Client/SalesModule.Client.Windows/Releases/*-Setup.exe
          SalesModule/src/Client/SalesModule.Client.Windows/Releases/*-Portable.zip
          SalesModule/src/Client/SalesModule.Client.Windows/Releases/*-${{ vars.APP_VERSION }}-*.nupkg

    # The update feed behind WindowsUpdate.FilesUrl.
    - name: Upload releases to R2
      run: |
          cd SalesModule\src\Client\SalesModule.Client.Windows\
          vpk upload s3 --endpoint ${{ vars.R2_ENDPOINT }} --bucket ${{ env.R2_BUCKET }} --keyId ${{ secrets.R2_ACCESS_KEY_ID }} --secret ${{ secrets.R2_SECRET_ACCESS_KEY }} -o .\Releases --keepMaxReleases 10
