name: cd-fabric

# Builds bit Fabric (src/Fabric) at one commit for an environment, on GitHub's own runners, which cost nothing in this
# public repository: the server's images, pushed to GitHub Container Registry, the Compose project, and the Windows app,
# signed and uploaded to the environment's bucket. Deploying is not done here: once a run ends, cd-fabric-dispatch.yml
# starts the deployment in the private bitfoundation/bitfabric-internal, whose job on the environment's own server takes
# the Compose project and the images from this run. The server, its runner and its secrets stay there, so nothing a pull
# request runs here can reach them. cd-fabric-test.yml and cd-fabric-production.yml call it.

on:
  workflow_call:
    inputs:
      ENV_NAME:
        required: true
        type: string
      CODE_REF:
        description: The branch, tag or commit to build.
        required: true
        type: string

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true
  # Lets the About page show the run, the commit and the attestations of the build, only in a public repository whose links anyone can open.
  ShowBuildProvenance: ${{ github.event.repository.visibility == 'public' }}

permissions:
  contents: read

jobs:

  # The commit to build, resolved once so every job builds the same one, and whether bitfabric's own CI (ci-fabric) has
  # already passed for it: a pull request's head commit has, and then its tests aren't run again here.
  code:
    name: find the code
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.find.outputs.sha }}
      ci_passed: ${{ steps.find.outputs.ci_passed }}
    steps:
      - name: Find the commit and its CI result
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          CODE_REF: ${{ inputs.CODE_REF }}
        run: |
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$CODE_REF" --jq .sha)"
          passed="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?check_name=build%20and%20test&per_page=100" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions" and .conclusion == "success")] | length > 0')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ci_passed=$passed" >> "$GITHUB_OUTPUT"
          echo "Building $CODE_REF, commit $sha. ci-fabric passed for it: $passed." >> "$GITHUB_STEP_SUMMARY"

  # ci-fabric's checks, run here only when they haven't passed for this commit: the formatting, the build with the code
  # style enforced, the Network's and Lighthouse's checks, the api's compatibility and the tests. Nothing is deployed or
  # published until they pass, while the server's images build alongside them: cd-fabric-dispatch.yml starts the
  # deployment only when this job passed or was skipped.
  ci:
    name: ci
    needs: code
    if: needs.code.outputs.ci_passed != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/Fabric
    steps:

      # The runner's preinstalled toolchains leave a thin margin once the tests are built, so drop the ones no project here uses.
      - name: Free disk space
        working-directory: ${{ github.workspace }}
        run: |
          sudo rm -rf /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/miniconda /opt/az /usr/local/lib/android/sdk/ndk
          df -h /

      - name: Checkout bit Fabric's code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.code.outputs.sha }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: src/Fabric/global.json

      - name: Verify formatting
        run: dotnet format whitespace --folder . --verify-no-changes

      # bit setup and the other long steps have a time limit of their own, well past their usual time, so a step that gets
      # stuck fails under its own name instead of running to the job's limit, as in ci-fabric.yml.
      - name: Prepare this machine with bit setup
        timeout-minutes: 25
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $tools = Join-Path $env:RUNNER_TEMP 'bit-cli'
          dotnet tool install Bit.Cli --version 11.0.0-pre-25 --tool-path $tools
          Add-Content $env:GITHUB_PATH $tools
          & (Join-Path $tools ($IsWindows ? 'bit.exe' : 'bit')) setup --yes --platforms android -p:EnforceCodeStyleInBuild=true

      - name: Typecheck the bitplatform Network
        working-directory: src/Fabric/src/Network
        run: npm ci --no-audit --no-fund && npm run typecheck

      - name: Typecheck and test the Lighthouse service
        working-directory: src/Fabric/src/Server/Bit.Fabric.Server.Lighthouse
        run: npm ci --no-audit --no-fund && npm run typecheck && npm test

      - name: Check that the api still works for the app versions it supports
        run: bit api check
        timeout-minutes: 10

      - name: Test
        id: test
        working-directory: src/Fabric/src/Tests
        run: dotnet test
        timeout-minutes: 20

      - name: Upload Tests Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() && steps.test.conclusion == 'failure' }}
        timeout-minutes: 10
        with:
          name: tests-artifact
          path: ./src/Fabric/src/Tests/TestResults
          retention-days: 14

  # The server is a Docker Compose project that .NET Aspire publishes from the app host. This job builds its images on
  # a GitHub-hosted runner, pushes them to GitHub Container Registry tagged with the environment and the commit, and
  # uploads the Compose file for bitfabric-internal's deployment, which runs on the environment's own server and builds
  # nothing.
  build_server:
    name: build server
    needs: code
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CODE_SHA: ${{ needs.code.outputs.sha }}
    defaults:
      run:
        working-directory: src/Fabric
    permissions:
      contents: read
      packages: write
    environment: ${{ inputs.ENV_NAME }}
    steps:

      # The Lighthouse image carries Chromium (about 1.2 GB) next to the apps' images, which together outgrew the runner's
      # free disk ("No space left on device", 2026-11-13). The same tools the ci job removes, which no step here uses.
      - name: Free disk space
        working-directory: ${{ github.workspace }}
        run: |
          sudo rm -rf /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/miniconda /opt/az /usr/local/lib/android/sdk/ndk
          df -h /

      - name: Checkout bit Fabric's code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.code.outputs.sha }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: src/Fabric/global.json

      # As in the ci job, the long steps have a time limit of their own.
      - name: Prepare this machine with bit setup
        timeout-minutes: 20
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $tools = Join-Path $env:RUNNER_TEMP 'bit-cli'
          dotnet tool install Bit.Cli --version 11.0.0-pre-25 --tool-path $tools
          Add-Content $env:GITHUB_PATH $tools
          & (Join-Path $tools ($IsWindows ? 'bit.exe' : 'bit')) setup --yes --no-build

      - name: Check the api against the released versions
        if: inputs.ENV_NAME == 'Production'
        run: bit api check --release
        timeout-minutes: 10

      # English and Persian only for now (bitfabric-internal/specs/build-and-ship.md): the other languages are translated later, not by machine at deploy time.
      # - name: Translate .resx files
      #   env:
      #     OpenAI__ApiKey: ${{ secrets.OPENAI_APIKEY }}
      #     OpenAI__Endpoint: ${{ vars.OPENAI_ENDPOINT }}
      #   run: |
      #     bit translate

      - name: Update core appsettings.json
        uses: devops-actions/variable-substitution@2344e258b5e8b1bd83b53f14271a410f7a4f5a44 # v3.1.0
        with:
          files: 'src/Fabric/src/**/appsettings*json'
        env:
          StatusPageSummaryUrl: ${{ vars.STATUS_PAGE_SUMMARY_URL }}
          ServerAddress: ${{ vars.SERVER_API_ADDRESS || vars.SERVER_ADDRESS }}
          # The pages and the apps post their telemetry to the web app's own address, whose /v1/ paths go to the dashboard
          # (See .docs/15, In a Deployment).
          Belemetry.OtlpEndpoint: ${{ vars.SERVER_ADDRESS }}
          AdsPushVapid.PublicKey: ${{ secrets.PUBLIC_VAPIDKEY }}

      # bit setup leaves the Aspire CLI out in CI, so it is installed here, at the version of the app host's Aspire SDK.
      - name: Install the Aspire CLI
        timeout-minutes: 10
        run: |
          version="$(grep -oE 'Aspire\.AppHost\.Sdk/[^"]+' src/Server/Bit.Fabric.Server.AppHost/Bit.Fabric.Server.AppHost.csproj | cut -d/ -f2)"
          dotnet tool install Aspire.Cli --version "$version" --tool-path "$RUNNER_TEMP/aspire-cli"
          echo "$RUNNER_TEMP/aspire-cli" >> "$GITHUB_PATH"

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # The apps' images and the Lighthouse service's, which Aspire builds from src/Server/Bit.Fabric.Server.Lighthouse/Dockerfile:
      # every image the Compose project's .env lists, as the deployment names them (<repository>/<name>:<environment>-<commit>).
      - name: Build and push the images
        timeout-minutes: 20
        env:
          ENV_NAME: ${{ inputs.ENV_NAME }}
        run: |
          # Every dotnet build and publish from here on reads Directory.Build.rsp - the ones Aspire runs to build the images
          # included - which gives the images the environment the other jobs pass with -p.
          echo "-p:Environment=$ENV_NAME" > Directory.Build.rsp
          export REGISTRY_ENDPOINT=ghcr.io REGISTRY_REPOSITORY="${GITHUB_REPOSITORY,,}" IMAGE_TAG="${ENV_NAME,,}-$CODE_SHA"
          # shellcheck disable=SC1010 # `do` is the aspire subcommand here, not the shell keyword.
          aspire do push --apphost src/Server/Bit.Fabric.Server.AppHost/Bit.Fabric.Server.AppHost.csproj --environment "$ENV_NAME" --non-interactive

      - name: Publish the Docker Compose project
        timeout-minutes: 10
        env:
          ENV_NAME: ${{ inputs.ENV_NAME }}
        run: aspire publish --apphost src/Server/Bit.Fabric.Server.AppHost/Bit.Fabric.Server.AppHost.csproj --environment "$ENV_NAME" --non-interactive --no-build --output-path aspire-output

      - name: Upload the Docker Compose project
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 10
        with:
          name: compose
          path: |
            src/Fabric/aspire-output/docker-compose.yaml
            src/Fabric/aspire-output/.env
          include-hidden-files: true # Required for .env, the list of values the deploy job has to supply
          # The deployment takes it from this run: a week leaves room to run that deployment again by hand.
          retention-days: 7

      # Still to do: find each pushed image's digest, attest it with actions/attest-build-provenance, and push the attestation to GHCR.

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io

  build_blazor_hybrid_windows:
    name: build blazor hybrid (windows)
    # On for Test and Production (2026-11-10): each uploads its installer and updates to its own R2 bucket, whose address
    # on bitfabric.co is WINDOWS_UPDATE_FILES_URL, and the home page links to that environment's installer.
    needs: [code, ci]
    if: ${{ !cancelled() && needs.code.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.ci.result) }}
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    environment: ${{ inputs.ENV_NAME }}
    defaults:
      run:
        working-directory: src/Fabric
    steps:

      - name: Checkout bit Fabric's code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.code.outputs.sha }}
          persist-credentials: false
  
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: src/Fabric/global.json

      # A time limit of its own, as in the ci job.
      - name: Prepare this machine with bit setup
        timeout-minutes: 20
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $tools = Join-Path $env:RUNNER_TEMP 'bit-cli'
          dotnet tool install Bit.Cli --version 11.0.0-pre-25 --tool-path $tools
          Add-Content $env:GITHUB_PATH $tools
          & (Join-Path $tools ($IsWindows ? 'bit.exe' : 'bit')) setup --yes --platforms windows --no-build

      # English and Persian only for now (bitfabric-internal/specs/build-and-ship.md): the other languages are translated later, not by machine at deploy time.
      # - name: Translate .resx files
      #   env:
      #     OpenAI__ApiKey: ${{ secrets.OPENAI_APIKEY }}
      #     OpenAI__Endpoint: ${{ vars.OPENAI_ENDPOINT }}
      #   run: |
      #     bit translate

      - name: Update core appsettings.json
        uses: devops-actions/variable-substitution@2344e258b5e8b1bd83b53f14271a410f7a4f5a44 # v3.1.0
        with:
          files: 'src\Fabric\src\**\appsettings*json'
        env:
          StatusPageSummaryUrl: ${{ vars.STATUS_PAGE_SUMMARY_URL }}
          ServerAddress: ${{ vars.SERVER_API_ADDRESS || vars.SERVER_ADDRESS }}
          Belemetry.OtlpEndpoint: ${{ vars.SERVER_ADDRESS }}
          WindowsUpdate.FilesUrl: ${{ vars.WINDOWS_UPDATE_FILES_URL }}

      # Logs in to Azure with the job's OIDC token and points vpk at the Artifact Signing account, so vpk pack signs the app.
      - name: Sign the app with Artifact Signing
        if: vars.CODE_SIGNING_ACCOUNT != ''
        timeout-minutes: 10
        uses: bitfoundation/bitfabric/.github/actions/bit-bp/artifact-signing@v-11.0.0-pre-25
        with:
          endpoint: ${{ vars.CODE_SIGNING_ENDPOINT }}
          account: ${{ vars.CODE_SIGNING_ACCOUNT }}
          certificate-profile: ${{ vars.CODE_SIGNING_CERTIFICATE_PROFILE }}
          client-id: ${{ secrets.CODE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ secrets.CODE_SIGNING_TENANT_ID }}
          subscription-id: ${{ secrets.CODE_SIGNING_SUBSCRIPTION_ID }}
          # Only the executables: every signed file counts against the account's monthly quota, which bitplatform shares.
          exclude: '\.dll$'

      - name: Publish
        timeout-minutes: 20
        env:
          # Read from the environment, so no character of the title is read as part of the script.
          APP_TITLE: ${{ vars.APP_TITLE }}
          BUILD_NUMBER: ${{ inputs.ENV_NAME != 'Production' && github.run_number || '' }}
        run: |
          cd src\Client\Bit.Fabric.Client.Windows\
          dotnet publish Bit.Fabric.Client.Windows.csproj -c Release -o .\publish-result -r win-x86 --self-contained -p:Environment=${{ inputs.ENV_NAME }}
          $version = dotnet msbuild Bit.Fabric.Client.Windows.csproj -getProperty:Version
          if ($env:BUILD_NUMBER) { $version = "$version-build.$env:BUILD_NUMBER" }
          dnx vpk@1.3.39-g8d2844f -- pack -u ${{ vars.APP_ID }} -v $version -p .\publish-result -e Bit.Fabric.Client.Windows.exe -r win-x86 --framework webview2 --icon .\wwwroot\favicon.ico --packTitle $env:APP_TITLE

      # The environment's bucket serves the installer the home page links to and the updates the installed app looks for.
      # vpk merges this release into the bucket's release feed and keeps the last few.
      - name: Upload the installer and its update
        timeout-minutes: 10
        env:
          WINDOWS_UPDATE_S3: ${{ secrets.WINDOWS_UPDATE_S3_CONNECTION_STRING }}
        run: |
          if (-not $env:WINDOWS_UPDATE_S3) { Write-Output "::error::Set WINDOWS_UPDATE_S3_CONNECTION_STRING, the key that writes to this environment's Windows bucket."; exit 1 }
          $s3 = @{}
          foreach ($part in $env:WINDOWS_UPDATE_S3.Split(';', [StringSplitOptions]::RemoveEmptyEntries)) { $key, $value = $part.Split('=', 2); $s3[$key.Trim()] = $value }
          cd src\Client\Bit.Fabric.Client.Windows\
          dnx vpk@1.3.39-g8d2844f -- upload s3 -o .\Releases --endpoint $s3.Endpoint --region $s3.Region --bucket $s3.BucketName --keyId $s3.AccessKey --secret $s3.SecretKey --keepMaxReleases 5

      - name: Upload artifact
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 10
        with:
          name: win-exe-bundle
          path: src\Fabric\src\Client\Bit.Fabric.Client.Windows\Releases
          retention-days: 1

      - name: Attest artifact
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        timeout-minutes: 10
        with:
          subject-name: win-exe-bundle
          subject-digest: sha256:${{ steps.artifact.outputs.artifact-digest }}

  build_blazor_hybrid_android:
    name: build blazor hybrid (android)
    # Off until the app ships on this platform: every run spends Actions minutes. Turn it on for the environments that
    # build it, such as `if: inputs.ENV_NAME == 'Production'`, and set its secrets (.docs/16).
    if: false
    needs: [code, ci]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    environment: ${{ inputs.ENV_NAME }}
    env:
      # Optional, and a step's if can't read a secret: the csproj leaves google-services.json out when it isn't there.
      GOOGLE_SERVICES_JSON_FILE_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_FILE_BASE64 }}
    defaults:
      run:
        working-directory: src/Fabric

    steps:
      - name: Checkout bit Fabric's code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.code.outputs.sha }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: src/Fabric/global.json

      # A time limit of its own, as in the ci job.
      - name: Prepare this machine with bit setup
        timeout-minutes: 20
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $tools = Join-Path $env:RUNNER_TEMP 'bit-cli'
          dotnet tool install Bit.Cli --version 11.0.0-pre-25 --tool-path $tools
          Add-Content $env:GITHUB_PATH $tools
          & (Join-Path $tools ($IsWindows ? 'bit.exe' : 'bit')) setup --yes --platforms android --no-build

      - name: Extract Android signing key
        uses: timheuer/base64-to-file@dfa5a5dd38803cb4f5c3a081eeb28e8362d43e9c # v2.0.0
        with:
          fileDir: './src/Fabric/src/Client/Bit.Fabric.Client.Maui/'
          fileName: 'Bit.Fabric.keystore'
          encodedString: ${{ secrets.ANDROID_RELEASE_KEYSTORE_FILE_BASE64 }}

      # Firebase's google-services.json, without which the app gets no push token (See .docs/22).
      - name: Extract google-services.json
        if: env.GOOGLE_SERVICES_JSON_FILE_BASE64 != ''
        uses: timheuer/base64-to-file@dfa5a5dd38803cb4f5c3a081eeb28e8362d43e9c # v2.0.0
        with:
          fileDir: './src/Fabric/src/Client/Bit.Fabric.Client.Maui/Platforms/Android/'
          fileName: 'google-services.json'
          encodedString: ${{ secrets.GOOGLE_SERVICES_JSON_FILE_BASE64 }}

      - name: Warn that the app gets no push notifications
        if: env.GOOGLE_SERVICES_JSON_FILE_BASE64 == ''
        run: echo "::warning::GOOGLE_SERVICES_JSON_FILE_BASE64 is not set, so the Android app gets no push notifications."

      # English and Persian only for now (bitfabric-internal/specs/build-and-ship.md): the other languages are translated later, not by machine at deploy time.
      # - name: Translate .resx files
      #   env:
      #     OpenAI__ApiKey: ${{ secrets.OPENAI_APIKEY }}
      #     OpenAI__Endpoint: ${{ vars.OPENAI_ENDPOINT }}
      #   run: |
      #     bit translate

      - name: Update core appsettings.json
        uses: devops-actions/variable-substitution@2344e258b5e8b1bd83b53f14271a410f7a4f5a44 # v3.1.0
        with:
          files: 'src/Fabric/src/**/appsettings*json'
        env:
          StatusPageSummaryUrl: ${{ vars.STATUS_PAGE_SUMMARY_URL }}
          ServerAddress: ${{ vars.SERVER_API_ADDRESS || vars.SERVER_ADDRESS }}
          Belemetry.OtlpEndpoint: ${{ vars.SERVER_ADDRESS }}

      - name: Publish aab
        timeout-minutes: 20
        env:
          # Read from the environment, so no character of the title is read as part of the script, and passed to MSBuild in
          # quotes of its own, so a comma in it doesn't end the property.
          APP_TITLE: ${{ vars.APP_TITLE }}
          BUILD_NUMBER: ${{ inputs.ENV_NAME != 'Production' && github.run_number || '' }}
        run: dotnet publish src/Client/Bit.Fabric.Client.Maui/Bit.Fabric.Client.Maui.csproj -c Release -p:ApplicationId=${{ vars.APP_ID }} "-p:ApplicationTitle=\"$APP_TITLE\"" ${BUILD_NUMBER:+-p:ApplicationVersion=$BUILD_NUMBER} -p:AndroidPackageFormat=aab -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="Bit.Fabric.keystore" -p:AndroidSigningKeyAlias=Bit.Fabric -p:AndroidSigningKeyPass="${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}" -p:AndroidSigningStorePass="${{ secrets.ANDROID_RELEASE_SIGNING_PASSWORD }}" -p:Environment=${{ inputs.ENV_NAME }} -f net11.0-android

      - name: Upload artifact
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 10
        with:
          name: android-bundle
          path: src/Fabric/src/Client/Bit.Fabric.Client.Maui/bin/Release/net11.0-android/*-Signed.*
          retention-days: 1

      - name: Attest artifact
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        timeout-minutes: 10
        with:
          subject-name: android-bundle
          subject-digest: sha256:${{ steps.artifact.outputs.artifact-digest }}

  build_blazor_hybrid_iOS:
    name: build blazor hybrid (iOS)
    # Off until the app ships on this platform: every run spends Actions minutes. Turn it on for the environments that
    # build it, such as `if: inputs.ENV_NAME == 'Production'`, and set its secrets (.docs/16).
    if: false
    needs: [code, ci]
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    environment: ${{ inputs.ENV_NAME }}
    defaults:
      run:
        working-directory: src/Fabric

    steps:

      - name: Checkout bit Fabric's code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.code.outputs.sha }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: src/Fabric/global.json

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '27.2'

      # A time limit of its own, as in the ci job.
      - name: Prepare this machine with bit setup
        timeout-minutes: 20
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $tools = Join-Path $env:RUNNER_TEMP 'bit-cli'
          dotnet tool install Bit.Cli --version 11.0.0-pre-25 --tool-path $tools
          Add-Content $env:GITHUB_PATH $tools
          & (Join-Path $tools ($IsWindows ? 'bit.exe' : 'bit')) setup --yes --platforms ios --no-build

      # English and Persian only for now (bitfabric-internal/specs/build-and-ship.md): the other languages are translated later, not by machine at deploy time.
      # - name: Translate .resx files
      #   env:
      #     OpenAI__ApiKey: ${{ secrets.OPENAI_APIKEY }}
      #     OpenAI__Endpoint: ${{ vars.OPENAI_ENDPOINT }}
      #   run: |
      #     bit translate

      - name: Update core appsettings.json
        uses: devops-actions/variable-substitution@2344e258b5e8b1bd83b53f14271a410f7a4f5a44 # v3.1.0
        with:
          files: 'src/Fabric/src/**/appsettings*json'
        env:
          StatusPageSummaryUrl: ${{ vars.STATUS_PAGE_SUMMARY_URL }}
          ServerAddress: ${{ vars.SERVER_API_ADDRESS || vars.SERVER_ADDRESS }}
          Belemetry.OtlpEndpoint: ${{ vars.SERVER_ADDRESS }}

      - name: Import Code-Signing Certificates
        uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c # v7.2.0
        timeout-minutes: 10
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CODE_SIGNING_CERTIFICATE_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CODE_SIGNING_CERTIFICATE_FILE_PASSWORD }}

      - name: Download Apple Provisioning Profiles
        uses: Apple-Actions/download-provisioning-profiles@233aa54e59082c0e8a8cf8b0b02c72dea2422ef9 # v7.1.0
        timeout-minutes: 10
        with:
          bundle-id: ${{ vars.APP_ID }}
          issuer-id: ${{ secrets.APPSTORE_API_KEY_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_KEY_PRIVATE_KEY }}

      - name: Build ipa
        timeout-minutes: 30
        env:
          # As for Android.
          APP_TITLE: ${{ vars.APP_TITLE }}
          BUILD_NUMBER: ${{ inputs.ENV_NAME != 'Production' && github.run_number || '' }}
        run: dotnet publish src/Client/Bit.Fabric.Client.Maui/Bit.Fabric.Client.Maui.csproj -p:ApplicationId=${{ vars.APP_ID }} "-p:ApplicationTitle=\"$APP_TITLE\"" ${BUILD_NUMBER:+-p:ApplicationVersion=$BUILD_NUMBER} -p:RuntimeIdentifier=ios-arm64 -c Release -p:ArchiveOnBuild=true -p:CodesignKey="iPhone Distribution" -p:CodesignProvision="${{ vars.IOS_CODE_SIGN_PROVISION }}" -p:Environment=${{ inputs.ENV_NAME }} -f net11.0-ios

      - name: Upload artifact
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 10
        with:
          name: iOS-bundle
          path: src/Fabric/src/Client/Bit.Fabric.Client.Maui/bin/release/net11.0-ios/ios-arm64/publish/*.ipa
          retention-days: 1

      - name: Attest artifact
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        timeout-minutes: 10
        with:
          subject-name: iOS-bundle
          subject-digest: sha256:${{ steps.artifact.outputs.artifact-digest }}
