name: ci-cli

# bit CLI's build and tests on Linux, Windows and macOS, one after another, then a dry run of bit new on this checkout's
# template, and a pack.
on:
  pull_request:
    paths:
    - 'src/Cli/**'
    - 'src/Bit.Build.props'
    - 'src/global.json'
    - 'src/Boilerplate/Bit.Boilerplate/.template.config/template.json'
    - 'src/Boilerplate/Bit.Boilerplate/src/Client/Boilerplate.Client.Core/package.json'
    - 'src/Boilerplate/Bit.Boilerplate/src/Server/Boilerplate.Server.AppHost/Boilerplate.Server.AppHost.csproj'
    - 'src/Boilerplate/Bit.Boilerplate/global.json'
    - '.github/actions/setup-bit-cli/**'
    - '.github/workflows/ci-cli.yml'
  push:
    branches: [ main ]
    paths:
    - 'src/Cli/**'
    - 'src/Bit.Build.props'
    - 'src/global.json'
    - '.github/workflows/ci-cli.yml'
  workflow_dispatch:
  workflow_call:

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read

concurrency:
  group: ci-cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-Cli:
    name: build bit CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ ubuntu-26.04, windows-2025, macOS-26 ]

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 11.0
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json

    - name: dotnet build
      run: dotnet build src/Cli/Bit.Cli.slnx -p:EnforceCodeStyleInBuild=true

    - name: dotnet test
      working-directory: src/Cli/Tests/Bit.Cli.Tests
      run: dotnet test --no-build

    - name: Setup bit CLI
      uses: ./.github/actions/setup-bit-cli

    - name: bit new dry run
      run: bit new Contoso.Shop --database PostgreSQL --redis --template-package "${{ env.BIT_TEMPLATE_PACKAGE }}" --dry-run --yes

    - name: dotnet pack
      if: runner.os == 'Linux'
      run: |
        dotnet build src/Cli/Bit.Cli/Bit.Cli.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Cli/Bit.Cli/Bit.Cli.csproj --output ./packages --configuration Release
