name: Deploy to server
description: Downloads a published server bundle, from this run or another one, and mirrors it into a site on the self-hosted runner, stopping and starting its app pool around the copy.

# Server-owned files are never copied or deleted.

inputs:
  artifact-name:
    description: Name of the artifact holding the published server bundle.
    required: true
  app-pool:
    description: Name of the application pool to stop/start around the copy.
    required: true
  site-path:
    description: Physical path of the site, e.g. C:\inetpub\AdminPanelApi.
    required: true
  sentinel-file:
    description: File that must exist in the downloaded bundle, e.g. AdminPanel.Server.Api.dll. Guards against mirroring an empty bundle over a live site.
    required: true
  health-check-url:
    description: URL polled after the app pool restarts. The deployment fails if it never returns a success status.
    required: true
  cloudflare-zone-id:
    description: Id of the Cloudflare zone the site's host is in.
    required: true
  cloudflare-token:
    description: Cloudflare API token carrying the Zone / Cache Purge permission.
    required: true
  app-cloudflare:
    description: Whether the app purges its own pages from Cloudflare's cache (it has a Cloudflare section in its settings). The deployment then hands it this token and zone, so the server keeps no copy of its own.
    required: false
    default: 'false'
  run-id:
    description: The run whose artifact this is, when it isn't the running one, such as a build in another repository.
    required: false
    default: ''
  repository:
    description: The repository of that run, as owner/name.
    required: false
    default: ''
  github-token:
    description: A token that can read that run's artifacts. Without it, the artifact is the running run's.
    required: false
    default: ''

runs:
  using: composite

  steps:

    - name: Download server bundle
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}\${{ inputs.artifact-name }}
        run-id: ${{ inputs.run-id || github.run_id }}
        repository: ${{ inputs.repository || github.repository }}
        github-token: ${{ inputs.github-token }}

    - name: Verify bundle
      shell: pwsh
      run: |
        $source = '${{ runner.temp }}\${{ inputs.artifact-name }}'
        $sentinel = Join-Path $source '${{ inputs.sentinel-file }}'
        if ((Test-Path -LiteralPath $sentinel) -eq $false) {
          throw "Bundle at $source has no ${{ inputs.sentinel-file }} - refusing to mirror it over ${{ inputs.site-path }}."
        }
        Write-Host "Bundle verified: $((Get-ChildItem $source -Recurse -File).Count) files."

    - name: Stop app pool
      shell: pwsh
      run: |
        # Exit codes are read below, not thrown on.
        $PSNativeCommandUseErrorActionPreference = $false
        $appcmd = "$env:windir\system32\inetsrv\appcmd.exe"

        $pools = & $appcmd list apppool /text:name
        if ($pools -notcontains '${{ inputs.app-pool }}') {
          throw "This runner has no app pool named '${{ inputs.app-pool }}'. Found: $($pools -join ', ')"
        }

        & $appcmd stop apppool /apppool.name:"${{ inputs.app-pool }}" | Out-Host

        # appcmd returns before w3wp releases the dll locks.
        $deadline = (Get-Date).AddSeconds(90)
        do {
          $state = (& $appcmd list apppool "${{ inputs.app-pool }}" /text:state)
          if ($state -eq 'Stopped') { break }
          Start-Sleep -Seconds 2
        } while ((Get-Date) -lt $deadline)

        if ($state -ne 'Stopped') { throw "App pool ${{ inputs.app-pool }} is still '$state' after 90s." }
        Start-Sleep -Seconds 3
        Write-Host "App pool ${{ inputs.app-pool }} stopped."
        exit 0

    - name: Mirror bundle into site
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $false
        $source = '${{ runner.temp }}\${{ inputs.artifact-name }}'
        $target = '${{ inputs.site-path }}'

        # /XF and /XD also filter the destination scan, so /MIR keeps these instead of deleting them.
        robocopy $source $target /MIR /R:5 /W:5 /NFL /NDL /NJH /NP `
          /XF 'appsettings*.json' 'AppCertificate.*' 'AppleAuthKey.p8' '*.pfx' `
          /XD 'App_Data' 'logs'
        $code = $LASTEXITCODE

        # robocopy: 0-7 succeed, 8+ fail.
        if ($code -ge 8) { throw "robocopy failed with exit code $code." }
        Write-Host "Mirrored into $target (robocopy exit code $code)."

        # pwsh exits with $LASTEXITCODE, which robocopy leaves non-zero on success.
        exit 0

    # The app purges a page from Cloudflare's cache once it is edited, with the token and zone this deployment purges
    # with below, rather than with a copy kept in the server's appsettings.json. web.config, which every deployment
    # replaces, hands them to the app as environment variables, which win over appsettings.json: the token lives in
    # GitHub alone, and a new one reaches the app with the next deployment.
    - name: Give the app its Cloudflare settings
      if: inputs.app-cloudflare == 'true'
      shell: pwsh
      env:
        CF_ZONE_ID: ${{ inputs.cloudflare-zone-id }}
        CF_TOKEN: ${{ inputs.cloudflare-token }}
      run: |
        $path = Join-Path '${{ inputs.site-path }}' 'web.config'
        $config = [xml](Get-Content -LiteralPath $path -Raw)
        $aspNetCore = $config.SelectSingleNode('//aspNetCore')
        if (-not $aspNetCore) { throw "$path has no aspNetCore element to give the app its environment variables in." }

        $variables = $aspNetCore.SelectSingleNode('environmentVariables')
        if (-not $variables) { $variables = $aspNetCore.AppendChild($config.CreateElement('environmentVariables')) }

        $settings = [ordered]@{ Cloudflare__ApiToken = $env:CF_TOKEN; Cloudflare__ZoneIds__0 = $env:CF_ZONE_ID }
        foreach ($name in $settings.Keys) {
          $variable = $variables.SelectSingleNode("environmentVariable[@name='$name']")
          if (-not $variable) { $variable = $variables.AppendChild($config.CreateElement('environmentVariable')) }
          $variable.SetAttribute('name', $name)
          $variable.SetAttribute('value', $settings[$name])
        }

        $config.Save($path)
        Write-Host "web.config gives the app Cloudflare's token and the zone $env:CF_ZONE_ID."

    - name: Start app pool
      if: always()
      shell: pwsh
      run: |
        # Exit codes are read below, not thrown on.
        $PSNativeCommandUseErrorActionPreference = $false
        $appcmd = "$env:windir\system32\inetsrv\appcmd.exe"
        & $appcmd start apppool /apppool.name:"${{ inputs.app-pool }}" | Out-Host

        $state = (& $appcmd list apppool "${{ inputs.app-pool }}" /text:state)
        if ($state -ne 'Started') { throw "App pool ${{ inputs.app-pool }} is '$state' after start." }
        Write-Host "App pool ${{ inputs.app-pool }} started."
        exit 0

    - name: Health check
      shell: pwsh
      run: |
        $url = '${{ inputs.health-check-url }}'
        for ($attempt = 1; $attempt -le 10; $attempt++) {
          try {
            $uncached = [UriBuilder]::new($url)
            $query = $uncached.Query.TrimStart('?')
            $uncached.Query = ($query ? "$query&" : '') + "deploy-check=$([guid]::NewGuid().ToString('N'))"
            $response = Invoke-WebRequest -Uri $uncached.Uri -UseBasicParsing -TimeoutSec 30
            Write-Host "$url returned $($response.StatusCode) on attempt $attempt."
            exit 0
          }
          catch {
            Write-Host "Attempt $attempt/10 failed: $($_.Exception.Message)"
            Start-Sleep -Seconds 15
          }
        }
        throw "$url never became healthy after the deployment."

    # After the health check, so the purge cannot re-warm the old build.
    - name: Purge Cloudflare cache
      shell: pwsh
      env:
        CF_ZONE_ID: ${{ inputs.cloudflare-zone-id }}
        CF_TOKEN: ${{ inputs.cloudflare-token }}
        HEALTH_CHECK_URL: ${{ inputs.health-check-url }}
      run: |
        # Only the deployed site's host: the zone also serves other sites, whose caches stay as they are.
        $hostName = ([uri]$env:HEALTH_CHECK_URL).Host
        $result = Invoke-RestMethod -Method Post `
          -Uri "https://api.cloudflare.com/client/v4/zones/$env:CF_ZONE_ID/purge_cache" `
          -Headers @{ Authorization = "Bearer $env:CF_TOKEN" } `
          -ContentType 'application/json' `
          -Body (@{ hosts = @($hostName) } | ConvertTo-Json -Compress)

        if (-not $result.success) {
          throw "Cloudflare purge failed: $($result.errors | ConvertTo-Json -Compress)"
        }
        Write-Host "Cloudflare cache of $hostName purged."
